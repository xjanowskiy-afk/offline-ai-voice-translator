name: Build On-Device Voice Translator APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Run Dependencies Setup Script
        run: |
          chmod +x ./setup_dependencies.sh
          ./setup_dependencies.sh

      - name: Build APK with Gradle
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/26.1.10909125
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-translator-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
